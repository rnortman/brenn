# Generic body-agnostic replay-protection component.
# Derives dedup identity from the x-brenn-push-signature header; body is never parsed.
# Implements brenn:replay@0.1.0 — loadable via the existing replay_protection config.
#

[package]
name = "brenn-replay-generic"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Runtime crate for the pinned wit-bindgen generator. The runtime is versioned
# independently of the generator and does not track its version.
wit-bindgen-rt = "0.44"

[package.metadata.component]
package = "brenn:replay"
target = { path = "../../wit/replay.wit" }

[package.metadata.component.dependencies]
