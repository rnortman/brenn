[package]
name = "brenn-replay"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Runtime crate for the pinned wit-bindgen generator. The runtime is versioned
# independently of the generator and does not track its version.
wit-bindgen-rt = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
brenn-cal = { version = "0.1.0", path = "../host-crates/brenn-cal" }

[package.metadata.component]
package = "brenn:replay"
target = { path = "../../wit/replay.wit" }

[package.metadata.component.dependencies]
