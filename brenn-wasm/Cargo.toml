[package]
name = "brenn-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
brenn-common = { version = "0.1.0", path = "../brenn-common" }
wasmtime = { version = "47", default-features = false, features = ["cranelift", "component-model", "runtime", "std"] }
chrono = "0.4.44"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tracing = "0.1"
semver = "1.0.28"
brenn-budget = { version = "0.1.0", path = "../brenn-budget" }
brenn-activation = { version = "0.1.0", path = "../brenn-activation" }
brenn-envelope = { version = "0.1.0", path = "../brenn-envelope" }

[dev-dependencies]
tempfile = "3"
# Read by the `surface_dom` suite alone (cargo has no per-test dependency
# granularity; the Bazel graph gives them to that one target).
brenn-surface-contract = { version = "0.1.0", path = "../surface/contract" }
brenn-chrome = { version = "0.1.0", path = "../surface/chrome" }
brenn-meeting = { version = "0.1.0", path = "../surface/components/meeting" }
brenn-cal = { version = "0.1.0", path = "../brenn-cal" }
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
serde_json = "1"
wat = "1"
