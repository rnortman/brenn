[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Policy runner: guards, policy parity, and the WIT gates"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.150"
toml = "1"
wasmparser = "0.244"
wit-component = "0.244"
wit-parser = "0.244"

[dev-dependencies]
git-fixture = { path = "../git-fixture" }
tempfile = "3"
wat = "1"
