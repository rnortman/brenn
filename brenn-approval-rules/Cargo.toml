[package]
name = "brenn-approval-rules"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pattern-based auto-approval for tool-use requests: rule compilation, layering, and matching"

# A sink: nothing here reaches back into the rest of the tree. Rules are
# compiled regexes over a tool name and a tool-specific extract of the tool
# input, so the crate needs a regex engine, serde for the TOML rule shape, a
# JSON value type for the input, and one async lock for the dynamic layer.
[dependencies]
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt"] }
