[package]
name = "brenn-automation"
version = "0.1.0"
edition = "2024"
publish = false
description = "Automation engine: cron-triggered jobs, per-fire auth and budget accounting, and the scheduler loop"

# Depends on brenn-lib for the config aggregate, the DB handle and the messaging
# bus it fires onto. Nothing in brenn-lib reaches back: the `[automation]`
# config section and the table DDL live there, and everything else about a job
# lives here.
[dependencies]
async-trait = "0.1.89"
brenn-db = { version = "0.1.0", path = "../brenn-db" }
brenn-envelope = { version = "0.1.0", path = "../brenn-envelope" }
brenn-lib = { version = "0.1.0", path = "../brenn-lib" }
brenn-messaging = { version = "0.1.0", path = "../brenn-messaging" }
brenn-obs = { version = "0.1.0", path = "../brenn-obs" }
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
croner = "3.0.1"
indexmap = "2"
rusqlite = { version = "0.39.0", features = ["bundled", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"
uuid = { version = "1.23.0", features = ["v4", "v5", "serde"] }

[dev-dependencies]
brenn-lib = { version = "0.1.0", path = "../brenn-lib", features = ["testutils"] }
brenn-messaging = { version = "0.1.0", path = "../brenn-messaging", features = ["testutils"] }
brenn-messaging-store = { version = "0.1.0", path = "../brenn-messaging-store" }
brenn-obs = { version = "0.1.0", path = "../brenn-obs", features = ["testutils"] }
tokio = { version = "1.50.0", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
