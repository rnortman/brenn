[package]
name = "brenn-wasm-dispatch"
version = "0.1.0"
edition = "2024"
publish = false
description = "Off-loop WASM consumer dispatch: one drain task per consumer, activation pacing, and the guest publish flush"

[features]
# Exposes the dispatch test harness to the crates above, whose suites drive this
# dispatcher through server and boot wiring. Not for production builds.
testutils = [
    "dep:indexmap",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:tempfile",
    "brenn-lib/testutils",
]

# Depends on brenn-lib for the messaging store it drains and the pacing bucket,
# on brenn-wasm for the guest host it invokes, and on brenn-obs for the
# throttle alert. Nothing above the server reaches back: the server only wires
# this task in, so a server edit leaves these tests cached.
[dependencies]
brenn-common = { version = "0.1.0", path = "../brenn-common" }
brenn-lib = { version = "0.1.0", path = "../brenn-lib" }
brenn-messaging = { version = "0.1.0", path = "../brenn-messaging" }
brenn-messaging-store = { version = "0.1.0", path = "../brenn-messaging-store" }
brenn-obs = { version = "0.1.0", path = "../brenn-obs" }
brenn-wasm = { version = "0.1.0", path = "../brenn-wasm" }
chrono = "0.4.44"
tokio = { version = "1.50.0", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"
uuid = { version = "1.23.0", features = ["v4"] }
# Optional, enabled by "testutils": the harness reads message bodies back out of
# sqlite, stages each component's store in a temp file, and builds ordered port
# maps. All four are dev-dependencies below as well, for this crate's own tests.
indexmap = { version = "2", optional = true }
rusqlite = { version = "0.39.0", optional = true }
serde_json = { version = "1.0.149", optional = true }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
brenn-lib = { version = "0.1.0", path = "../brenn-lib", features = ["testutils"] }
brenn-messaging = { version = "0.1.0", path = "../brenn-messaging", features = ["testutils"] }
brenn-obs = { version = "0.1.0", path = "../brenn-obs", features = ["testutils"] }
indexmap = "2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["full", "test-util"] }
# "no-env-filter" makes `#[traced_test]` capture unconditionally; without it
# tracing-test applies a default env filter and `logs_contain` assertions fail.
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
