[package]
name = "brenn-device-location"
version = "0.1.0"
edition = "2024"
publish = false
description = "Device location: the fix validator, the per-user location channel's messages and consent section, and the registry tool that answers the acting user's devices' positions and zones"

# Depends only downward: no crate that wires this one in (server, bootstrap)
# is named here.
[dependencies]
async-trait = "0.1.89"
brenn-db = { version = "0.1.0", path = "../brenn-db" }
brenn-lib = { version = "0.1.0", path = "../brenn-lib" }
brenn-messaging = { version = "0.1.0", path = "../brenn-messaging" }
brenn-tool-registry = { version = "0.1.0", path = "../brenn-tool-registry" }
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
rusqlite = { version = "0.39.0", features = ["bundled", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
brenn-messaging = { version = "0.1.0", path = "../brenn-messaging", features = ["testutils"] }
tokio = { version = "1.50.0", features = ["macros", "rt", "rt-multi-thread"] }
