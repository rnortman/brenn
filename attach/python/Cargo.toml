[package]
name = "brenn-attach-python"
version = "0.1.0"
edition = "2024"
publish = false
description = "Brenn bus attachment for Python — the `brenn_bus` CPython extension module"

# `cdylib` is the extension module itself; `rlib` gives a crate_universe
# consumer a library target to re-export from its own shared library.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brenn-attach-blocking = { path = "../blocking" }
brenn-attach-client = { path = "../client" }
brenn-attach-proto = { path = "../proto" }
brenn-envelope = { path = "../../brenn-envelope" }
# Built against CPython's limited API with 3.13 as its floor, so one module
# loads under every later CPython 3. `extension-module` leaves the interpreter's
# symbols undefined for the host process to supply: no libpython is linked.
# `chrono` converts an envelope's `publish_ts` to an aware `datetime`.
pyo3 = { version = "0.29.0", features = ["abi3-py313", "chrono", "extension-module"] }

# `tls_front`, the tests' TLS relay. The TLS stack carries exactly the features
# the workspace already builds with, `aws_lc_rs` and no `ring` provider.
[dev-dependencies]
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1.50.0", features = ["rt", "net", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
