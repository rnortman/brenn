[package]
name = "brenn-mqtt"
version = "0.1.0"
edition = "2024"
publish = false
description = "MQTT transport runtime: per-client supervisors, sessions, payload classification, and egress enforcement"

# Depends on brenn-lib for the resolved client config it dials with, the
# addresses it publishes to and the send-budget rows it decrements. Nothing in
# brenn-lib reaches back: the `[[mqtt_client]]` config section, `MqttAddress`
# and `MqttError` live there because the config aggregate, `access` and
# `messaging` read them, and everything on the wire lives here.
[features]
# Expose `test_support` — the mosquitto harness and its generated TLS material —
# to the crates above, which drive ingress and reload through a real broker. Not
# for production builds; the release configurations clear the flag.
testutils = ["dep:libc", "dep:rcgen", "dep:tempfile"]

[dependencies]
brenn-db = { version = "0.1.0", path = "../brenn-db" }
brenn-envelope = { version = "0.1.0", path = "../brenn-envelope" }
brenn-lib = { version = "0.1.0", path = "../brenn-lib" }
brenn-messaging-store = { version = "0.1.0", path = "../brenn-messaging-store" }
async-trait = "0.1.89"
base64ct = { version = "1.8.3", features = ["alloc"] }
rumqttc = { package = "rumqttc-next", version = "0.33.2", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"
# Optional, enabled by "testutils": the broker harness sets PR_SET_PDEATHSIG on
# the child, mints its throwaway CA, and owns a temp dir per broker.
libc = { version = "0.2.183", optional = true }
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "crypto", "ring"], optional = true }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
brenn-lib = { version = "0.1.0", path = "../brenn-lib", features = ["testutils"] }
brenn-messaging-store = { version = "0.1.0", path = "../brenn-messaging-store", features = ["testutils"] }
rusqlite = { version = "0.39.0", features = ["bundled", "trace"] }
uuid = { version = "1.23.0", features = ["v4"] }
tokio = { version = "1.50.0", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
