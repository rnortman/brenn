[package]
name = "brenn-tool-registry"
version = "0.1.0"
edition = "2024"
publish = false
description = "The tool registry and its execution paths: descriptors, grants, throttling, the bus-driven async executor, and the WASM caller host"

[features]
# Expose the ACL clause/grant builders to downstream test targets, which
# construct registries and stub tools with them. Not for production builds.
testutils = []

# Reaches down to brenn-lib for the resolved grant vocabulary and the message
# store an async call travels over, to brenn-git for the clone index and the
# pull the `git-repo-pull` tool runs, and to brenn-wasm for the queued-request
# shape the component host answers. Nothing above is named here.
[dependencies]
async-trait = "0.1.89"
brenn-git = { version = "0.1.0", path = "../brenn-git" }
brenn-lib = { version = "0.1.0", path = "../brenn-lib" }
brenn-messaging = { version = "0.1.0", path = "../brenn-messaging" }
brenn-messaging-store = { version = "0.1.0", path = "../brenn-messaging-store" }
brenn-obs = { version = "0.1.0", path = "../brenn-obs" }
brenn-wasm = { version = "0.1.0", path = "../brenn-wasm" }
futures = "0.3.32"
indexmap = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
brenn-lib = { version = "0.1.0", path = "../brenn-lib", features = ["testutils"] }
brenn-messaging = { version = "0.1.0", path = "../brenn-messaging", features = ["testutils"] }
brenn-obs = { version = "0.1.0", path = "../brenn-obs", features = ["testutils"] }
chrono = { version = "0.4.44", features = ["serde"] }
git-fixture = { version = "0.1.0", path = "../git-fixture" }
tempfile = "3.27.0"
uuid = { version = "1.23.0", features = ["v4"] }
tokio = { version = "1.50.0", features = ["full", "test-util"] }
