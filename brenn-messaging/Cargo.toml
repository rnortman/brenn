[package]
name = "brenn-messaging"
version = "0.1.0"
edition = "2024"
publish = false
description = "The messaging runtime: the Messenger engine, the channel stores, and the messaging tables"

# Depends on brenn-lib for the addressing/config vocabulary the engine speaks,
# the app config aggregate and the ACL gates. Nothing in brenn-lib reaches back:
# the half of the subsystem brenn-lib's own production code reads lives there,
# in `brenn_lib::messaging`, and this crate re-exports it.
[features]
testutils = ["brenn-messaging-store/testutils"]

[dependencies]
brenn-budget = { version = "0.1.0", path = "../brenn-budget" }
brenn-common = { version = "0.1.0", path = "../brenn-common" }
brenn-db = { version = "0.1.0", path = "../brenn-db" }
brenn-envelope = { path = "../brenn-envelope" }
brenn-lib = { version = "0.1.0", path = "../brenn-lib" }
brenn-messaging-store = { version = "0.1.0", path = "../brenn-messaging-store" }
brenn-obs = { version = "0.1.0", path = "../brenn-obs" }
brenn-queue = { version = "0.1.0", path = "../brenn-queue" }
brenn-surface-schema = { version = "0.1.0", path = "../surface/schema" }
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
indexmap = "2"
rusqlite = { version = "0.39.0", features = ["bundled", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"
uuid = { version = "1.23.0", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
brenn-lib = { version = "0.1.0", path = "../brenn-lib", features = ["testutils"] }
tokio = { version = "1.50.0", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
tracing-test = "0.2.6"
