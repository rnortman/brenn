name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_comparisons:
        description: "Also run the uncached canary job (~2 runner-hours)"
        type: boolean
        default: false
  # Each expression below is matched verbatim by the `if:` of the job it selects,
  # and xtask's sync guard holds the two sets equal — an edit here alone leaves
  # that job selecting a schedule that no longer fires, which is absence rather
  # than failure and nothing else would notice.
  schedule:
    # The cache-soundness canary. Weekly, because what it catches does not
    # change with the tree.
    - cron: "43 6 * * 1"

# Every job only reads the tree. Pinned here so a permissive repo-level default
# cannot silently hand a write-capable token to cached actions, a downloaded
# tool, or anything `make` executes.
permissions:
  contents: read

jobs:
  check:
    # This string is the required-check identifier the branch-protection ruleset
    # keys on. Do not rename it or branch protection silently detaches. It names
    # what the gate covers, not how: fmt, clippy and the test suite are three of
    # the invocations inside `make bazel-check`.
    name: check (fmt, clippy, test)
    # The schedule trigger exists for the canary job below, which selects its
    # own cron. This job gates changes, so a cron tick has nothing for it to
    # gate: it would re-run the whole graph against a HEAD that already passed,
    # and a red result would read as a broken main branch with no change behind
    # it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Cold, this fetches every toolchain and builds the whole graph twice over —
    # the dev configuration for the gate, the release one for the package — and
    # the second pass cross-compiles the binaries' closure for musl; warm, it is
    # minutes. 120 bounds the cold case without flaking it.
    timeout-minutes: 120
    steps:
      # TODO(fleet-sha-pin-actions): marketplace actions are tag-pinned. Tags are
      # mutable, so this is looser than the sha256-pinned gitleaks download in
      # the scrub job; converging to commit-SHA pins is tracked separately.
      - uses: actions/checkout@v7

      # The MQTT integration tests spawn their own broker, and mosquitto is the
      # one system dependency the build graph does not vend. Rust, node, the
      # three WASM CLIs and gitleaks are all hermetic toolchains behind
      # bazelisk, which GitHub runners preinstall and which reads .bazelversion
      # — so there is no toolchain install step here at all.
      #
      # lld is for the host C toolchain rules_cc autodetects: its probe takes
      # lld if present, else gold, and hard-wires the winner into every link the
      # toolchain does. This image ships gold, which rustc has deprecated and
      # warns about on every link — and will eventually stop supporting. Only
      # the host lane is affected (test binaries, build tools); release binaries
      # link through the hermetic musl toolchain either way.
      - name: Install mosquitto and lld
        run: sudo apt-get update && sudo apt-get install -y mosquitto lld

      # --config=ci points both bazel caches inside the workspace so
      # actions/cache can carry them; the GC size cap is what keeps the disk
      # cache inside the cache scope. One entry for the pair: they are restored
      # and saved together, and a run that had one without the other would fetch
      # or rebuild the missing half anyway. Restore/save are split so a red run
      # still banks the actions it did complete — a combined cache saves only on
      # job success.
      - name: Restore bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .bazel-disk-cache
            .bazel-repo-cache
          key: bazel-disk-${{ github.sha }}
          restore-keys: bazel-disk-

      - run: make bazel-check BAZEL_CONFIG=--config=ci

      # Set equality between the policy scan's file set and the tracked tree, in
      # both directions. Outside `bazel-check` because it cannot run in the
      # sandbox — it needs git — and because every untracked file is a
      # difference: signal on a fresh checkout, noise on a working tree.
      - run: make bazel-policy-parity BAZEL_CONFIG=--config=ci

      # The out-of-tree authoring example. It is its own Bazel root module, so
      # it runs in its own output base; the lane points it at the same two
      # caches the `ci` config gives brenn (its .bazelrc carries no `ci` stanza).
      - run: make example-check EXAMPLE_LANE=ci

      # The release lane, which `bazel test //...` above does not reach: it
      # builds the package in the dev configuration, so the musl platform
      # transition, the `select()` that picks the linkage assertion, and the
      # assertion itself only run under --config=release-package. Without this
      # step that machinery is first exercised by a deploy, where a wrong answer
      # stops the service before it fails. The second verb is the path the
      # deploying repo tars, checked to exist here rather than by that repo.
      #
      # The id is a constant, not the commit sha. `STABLE_BRENN_BUILD_ID` is a
      # stable workspace-status key, so it is a cache key on the root binary's
      # compile and link, the stamped bundles, and everything staged from them:
      # a per-commit value re-runs that whole closure on every commit, including
      # ones that touch only a changelog. Nothing here consumes the value —
      # GitHub publishes no artifact, the tarball is only checked to exist — and
      # the deploying repo stamps the real per-version id on its own runner.
      - name: Release package
        env:
          BRENN_BUILD_ID: ci-gate
        run: |
          make bazel-release BAZEL_CONFIG=--config=ci
          make bazel-release-dir BAZEL_CONFIG=--config=ci

      # TODO(bazel-ci-cache-pressure): this job builds two configurations into
      # one disk cache — the dev graph for the gate and the release package —
      # against the GC cap `build:ci` sets in `.bazelrc` and GitHub's ~10G
      # per-repo cache budget, which the repository cache shares with it in the
      # one entry. Saturation fails nothing; Bazel's GC and GitHub's eviction
      # just start trading warm hits away until green runs are cold-slow again.
      # So both sizes are reported here and the sizing call waits on real
      # numbers.
      #
      # The watermark is read out of `.bazelrc` rather than written here: the
      # cap is one of the remediations this measurement may prescribe, and a
      # hardcoded watermark would go quietly unreachable the moment the cap
      # dropped below it. That makes the cap's spelling a cross-file coupling,
      # pinned by `ci_cache_watermark_violations` in xtask's sync guard — a cap
      # this step cannot parse fails there, where it is a change to fix rather
      # than a warning nobody was going to get.
      #
      # Warn, never fail: cache pressure costs time, not correctness, and this
      # job's red has to keep meaning "the change is wrong". Runs whatever the
      # gate did, so a red run still reports its size.
      #
      # TODO(bazel-ci-timings): the other post-landing read-out rides the same
      # cadence as this one and nothing here emits it — per-step durations
      # across docs-only, component-only and source commits, which is what
      # decides whether the crate split's incremental floor is acceptable. Read
      # from the run summaries for ~2 weeks; no step is added for it.
      - name: Report bazel cache sizes
        if: always()
        run: |
          # Report-only, and no watermark: the repository cache has no size cap
          # to place one against — the GC flags bazel offers for fetched repos
          # are age-based and belong to the repo contents cache, which
          # `build:ci` disables. It shares the actions/cache budget with the
          # disk cache, so its size is part of what the TODO reads.
          repo_size=$(du -sk .bazel-repo-cache 2>/dev/null | cut -f1 || true)
          if [ -n "$repo_size" ]; then
            echo "bazel repository cache: $((repo_size / 1024)) MiB"
          else
            echo "no .bazel-repo-cache to size; nothing was fetched into it this run"
          fi
          size=$(du -sk .bazel-disk-cache 2>/dev/null | cut -f1 || true)
          if [ -z "$size" ]; then
            echo "no .bazel-disk-cache to size; nothing was cached this run"
            exit 0
          fi
          echo "bazel disk cache: $((size / 1024)) MiB"
          # Last match, mirroring bazel's own last-flag-wins reading of a
          # repeated flag — and keeping `cap` to one line, because arithmetic on
          # two is a syntax error and `bash -e` would redden this step with it.
          cap=$(sed -n 's/^build:ci --experimental_disk_cache_gc_max_size=\([0-9]\{1,\}\)G$/\1/p' .bazelrc | tail -n1)
          if [ -z "$cap" ]; then
            echo "::warning::no build:ci --experimental_disk_cache_gc_max_size=<n>G in .bazelrc; this step can place no watermark and is reporting size only — see TODO(bazel-ci-cache-pressure)"
            exit 0
          fi
          watermark=$(( cap * 1024 * 1024 * 9 / 10 ))
          if [ "$size" -gt "$watermark" ]; then
            echo "::warning::bazel disk cache is $((size / 1024)) MiB, past 90% of the ${cap}G GC cap build:ci sets in .bazelrc — see TODO(bazel-ci-cache-pressure)"
          fi

      - name: Save bazel caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .bazel-disk-cache
            .bazel-repo-cache
          key: bazel-disk-${{ github.sha }}

  # Belt and braces against the residual class Bazel cannot see: an undeclared
  # *system* input — the apt mosquitto, the kernel, the runner image. No cache
  # is restored and no test result is reused, so this is a cold build and a full
  # suite.
  #
  # Off by default on a manual dispatch: the ordinary reason to dispatch is to
  # re-run the gate on a ref, and this job is ~2 runner-hours of advisory work
  # between the operator and the gate's verdict.
  cache-canary:
    name: bazel (uncached canary)
    if: github.event.schedule == '43 6 * * 1' || github.event.inputs.run_comparisons == 'true'
    runs-on: ubuntu-latest
    # Everything from scratch, twice over: no disk cache and no reused results.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Same pair as the gate job, for the same reasons: mosquitto is the one
      # system dependency the graph does not vend, and lld keeps the
      # autodetected C toolchain off the deprecated gold linker.
      - name: Install mosquitto and lld
        run: sudo apt-get update && sudo apt-get install -y mosquitto lld

      - run: bazel test --config=ci --nocache_test_results //...

      # The release closure, which the invocation above does not reach: it
      # builds the package in the dev configuration, so the musl transition, the
      # linkage assertion, and the package layout only run under
      # --config=release-package. The gate job stamps a constant build id, so
      # its release actions can stay cached across commits indefinitely; this
      # job restores no cache, which makes it the from-scratch rebuild that
      # catches an undeclared input rotting underneath them. Its own id, so a
      # canary result can never be mistaken for a gate result.
      - name: Release package (from scratch)
        env:
          BRENN_BUILD_ID: ci-canary
        run: make bazel-release BAZEL_CONFIG=--config=ci

  scrub:
    name: scrub
    # Same reasoning as `check`: the crons belong to the comparison jobs, and a
    # full tree scan of an unchanged HEAD is minutes spent on nothing.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installed outside the checkout: the tree scan below must see repo content
      # only, not the scanner's own ~30 MB of binary artifacts.
      #
      # The sha256 is the release's published checksum for this asset. Release
      # assets are mutable, so the version self-check alone proves nothing — a
      # swapped binary reports whatever version it likes and then writes the
      # report that decides this job's verdict. The hash is the real gate; the
      # version check stays as a secondary sanity line.
      #
      # Both values are held equal to MODULE.bazel's pin for the same asset by
      # xtask's sync guard: the tests that validate the wrapper and the scan that
      # decides this verdict must run one binary.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version | grep -qx "${GITLEAKS_VERSION}"

      # --exit-code 0 makes leaks a reporting outcome, so a nonzero exit here
      # means gitleaks itself malfunctioned.
      - name: Scan tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path "$RUNNER_TEMP/findings.json" \
            --no-banner \
            --exit-code 0 \
            --log-level error

      # `ephemeral-reference` is enforced on diffs only: the existing backlog
      # is grandfathered and burns down as lines are touched.
      - name: Report
        run: |
          count=$(jq '[.[] | select(.RuleID != "ephemeral-reference")] | length' "$RUNNER_TEMP/findings.json")
          if [ "$count" -ne 0 ]; then
            echo "::error::$count scrub finding(s) in tree scan"
            jq -r '.[] | select(.RuleID != "ephemeral-reference")
                   | "\(.File):\(.StartLine): [\(.RuleID)] \(.Description)"' "$RUNNER_TEMP/findings.json"
            exit 1
          fi
          echo "clean"
