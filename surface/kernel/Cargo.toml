[package]
name = "brenn-surface-kernel"
version = "0.1.0"
edition = "2024"
publish = false
description = "Brenn surface kernel — sans-I/O WS protocol core + async driver plus the browser platform half (mount/route/publish/telemetry, connect indicator, error cards); compiled to wasm for the browser and to native for tests"

# The kernel is both the browser cdylib (wasm-bindgen entry in `entry.rs`) and an
# rlib the server links natively for the protected client-conformance suite and
# test support.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The attacher-generic client half: transport shims and the monotonic time
# currency the core and driver are driven with.
brenn-attach-client = { version = "0.1.0", path = "../../attach/client" }
# The attachment protocol's frames, which the surface layer composes and reads
# directly wherever the generic client hands one back rather than acting on it.
brenn-attach-proto = { version = "0.1.0", path = "../../attach/proto" }
brenn-surface-schema = { version = "0.1.0", path = "../schema" }
brenn-surface-contract = { version = "0.1.0", path = "../contract" }
brenn-envelope = { version = "0.1.0", path = "../../brenn-envelope" }
# The shared channel mechanics (retained ring, cursors, deferral). Dependency-free
# and std-only, so it links into the wasm32 build unchanged.
brenn-queue = { version = "0.1.0", path = "../../brenn-queue" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4", "serde", "js"] }
# No `clock` feature on either target: this crate reads no wall clock of its own
# — the attach client's shim owns that — and only constructs and compares
# `DateTime<Utc>`. Version-unified with brenn-envelope, whose values those are.
chrono = { version = "0.4.44", default-features = false, features = ["serde", "alloc"] }
futures-util = "0.3.32"
futures-channel = "0.3.32"
tracing = "0.1.44"
brenn-budget = { version = "0.1.0", path = "../../brenn-budget" }

# The platform half's DOM effect executor (`dom.rs`) and wasm-bindgen entry
# (`entry.rs`): DOM creation, text rendering, CustomEvent dispatch/listeners, and
# the entry that wires the client driver + event loop, plus the backoff-jitter
# seed source (`Math.random`). Host builds exclude all of this and need none of
# it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4.75"
js-sys = "0.3.102"
web-sys = { version = "0.3.102", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Event",
    "EventTarget",
    "CustomEvent",
    "CustomEventInit",
    "CustomElementRegistry",
    "CssStyleDeclaration",
    "NodeList",
    "Location",
    "Performance",
    "console",
] }

# Host-only test fixtures. A dev-dependency never enters the wasm release graph,
# so the browser bundle is unaffected.
[dev-dependencies]
brenn-surface-test-fixtures = { path = "../test-fixtures" }

# Driver tests use paused virtual time (`start_paused`) to drive backoff,
# handshake-timeout, and liveness deadlines deterministically.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.50.0", features = ["rt", "time", "macros", "test-util"] }

# Browser-level unit tests (dom.rs, entry.rs) run under wasm-bindgen-test via
# the browser test runner; wasm32-only so a host test sweep never
# pulls them. futures-channel scripts the fake connector's transport events; the
# component-support path dep lets the entry integration test register a real
# custom element.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
futures-channel = { workspace = true }
brenn-surface-component-support = { path = "../component-support" }
