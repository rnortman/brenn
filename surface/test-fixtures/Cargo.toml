[package]
name = "brenn-surface-test-fixtures"
version = "0.1.0"
edition = "2024"
publish = false
description = "The canonical delivered-envelope JSON fixture shared by the surface test suites"

[dependencies]
brenn-envelope = { path = "../../brenn-envelope" }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["serde"] }

# The shared component browser-suite harness (browser.rs) drives real DOM seams,
# so it is wasm32-only and its deps never enter the host build. Every one of them
# is already in the wasm build of the crates that consume this harness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
brenn-surface-contract = { version = "0.1.0", path = "../contract" }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlElement",
    "Window",
] }
