[package]
name = "brenn-surface-schema"
version = "0.1.0"
edition = "2024"
publish = false
description = "Brenn surface application payload schemas — shared between the backend and the surface kernel (wasm + native)"

[dependencies]
brenn-envelope = { path = "../../brenn-envelope" }
chrono = { version = "0.4.44", default-features = false, features = ["serde", "alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["serde"] }
