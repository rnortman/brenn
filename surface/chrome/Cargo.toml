[package]
name = "brenn-chrome"
version = "0.1.0"
edition = "2024"
publish = false
description = "Brenn surface chrome component — the in-tree default chrome: the one page-hosted component holding page authority, owning layout, takeover, theme, banner, and toast rendering, driven entirely by port messages"

[lib]
crate-type = ["cdylib"]

# Ungated deps must link in both the host build (unit tests, the help
# generator) and the wasm32 guest artifact. Host-only deps are gated below.
[dependencies]
brenn-envelope = { path = "../../brenn-envelope" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Host-only: the help generator, whose reserved-plane addresses and sidecar
# header come from the surface crates, and the wire-shape parity tests beside
# the crate's own spellings.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brenn-surface-schema = { version = "0.1.0", path = "../schema" }
brenn-surface-contract = { version = "0.1.0", path = "../contract" }

[dev-dependencies]
brenn-surface-test-fixtures = { path = "../test-fixtures" }

