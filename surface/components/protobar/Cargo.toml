[package]
name = "brenn-protobar"
version = "0.1.0"
edition = "2024"
publish = false
description = "Brenn surface protobar component — subscribes to one ephemeral channel and renders message text (contract v0, receive-only)"

[lib]
crate-type = ["cdylib"]

# Ungated deps must link in both the host build (unit tests) and the wasm32
# guest artifact. Host-only and wasm32-only deps are gated below.
[dependencies]
brenn-envelope = { path = "../../../brenn-envelope" }
chrono = { version = "0.4.44", default-features = false, features = ["serde", "alloc"] }
# Events-only markdown: the tree builder drives the parser and never names the
# HTML writer, which is therefore unreferenced and dropped at link. Shared
# workspace pin keeps it in lockstep with the backend's server-side renderer.
pulldown-cmark = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Host-only: the help generator and its drift gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brenn-surface-contract = { version = "0.1.0", path = "../../contract" }

[dev-dependencies]
brenn-surface-test-fixtures = { path = "../../test-fixtures" }
