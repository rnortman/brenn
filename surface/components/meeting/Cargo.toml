[package]
name = "brenn-meeting"
version = "0.1.0"
edition = "2024"
publish = false
description = "Brenn surface meeting component — computes time-to-next-meeting locally from an agenda snapshot and escalates through ambient/takeover/critical/overdue, publishing dismiss/snooze acks"

[lib]
crate-type = ["cdylib"]

# Ungated deps must link in both the host build (unit tests) and the wasm32
# guest artifact. Host-only deps are gated below.
[dependencies]
brenn-envelope = { path = "../../../brenn-envelope" }
chrono = { version = "0.4.44", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Host-only: the help generator, whose channel addresses and sidecar header come
# from the surface crates, and the wire-shape parity test beside it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brenn-surface-contract = { version = "0.1.0", path = "../../contract" }
brenn-surface-schema = { version = "0.1.0", path = "../../schema" }

[dev-dependencies]
brenn-surface-test-fixtures = { path = "../../test-fixtures" }
