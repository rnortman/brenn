[package]
name = "brenn-echo-stub"
version = "0.1.0"
edition = "2024"
publish = false
description = "Brenn surface echo-stub — minimal dev/test component exercising the page-hosted seam (message rendering, gesture publish, and the trap → error-card path)"

[lib]
crate-type = ["cdylib"]

# The component's retained state is serde-serialized onto its `state` port, and
# the derive is on a wasm32-only type — so serde is a guest-side dependency and
# nothing here is needed by both builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brenn-surface-contract = { version = "0.1.0", path = "../../contract" }

[dev-dependencies]
brenn-surface-test-fixtures = { path = "../../test-fixtures" }
