[package]
name = "brenn-echo-stub"
version = "0.1.0"
edition = "2024"
publish = false
description = "Brenn surface echo-stub — minimal dev/test component exercising contract v0 (message rendering, publish, and component-panic plumbing) before protobar exists"

[lib]
crate-type = ["cdylib"]

# The help generator (help.rs) is host-compiled and emits contract's sidecar
# header, so contract is an ungated normal dep; everything else this component
# needs is browser-only.
[dependencies]
brenn-surface-contract = { version = "0.1.0", path = "../../contract" }

# The help-sidecar drift gate is a host test, so the fixtures crate is ungated;
# the browser tests run in a real browser.
[dev-dependencies]
brenn-surface-test-fixtures = { path = "../../test-fixtures" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = { workspace = true }
wasm-bindgen-test = { workspace = true }

# The echo-stub is a browser-only wasm-bindgen component module: all of its DOM
# behavior is behind cfg(target_arch = "wasm32"), so the host build carries only
# the help generator and its drift test.
[target.'cfg(target_arch = "wasm32")'.dependencies]
brenn-surface-schema = { version = "0.1.0", path = "../../schema" }
brenn-surface-component-support = { version = "0.1.0", path = "../../component-support" }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Event",
    "EventTarget",
] }
serde_json = "1.0.149"
