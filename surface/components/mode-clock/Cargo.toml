[package]
name = "brenn-mode-clock"
version = "0.1.0"
edition = "2024"
publish = false
description = "Brenn surface mode-clock component — headless clock watcher that drives the runtime dark/light theme axis from a retained config channel (auto schedule / fixed dark / fixed light)"

[lib]
crate-type = ["cdylib"]

# The DOM-free config/schedule state machine (logic.rs) is compiled and
# unit-tested on the host, and compiled again into the wasm32 guest artifact.
# It therefore names only crates both crate universes carry: serde, serde_json,
# and the envelope carrier. The help generator (help.rs) is host-only and
# reaches the surface crates freely; the component glue (component.rs) is
# wasm32-only and reaches the guest SDK.
[dependencies]
brenn-envelope = { version = "0.1.0", path = "../../../brenn-envelope" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Host-only: the help generator and its drift gate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brenn-surface-schema = { version = "0.1.0", path = "../../schema" }
brenn-surface-contract = { version = "0.1.0", path = "../../contract" }

[dev-dependencies]
brenn-surface-test-fixtures = { path = "../../test-fixtures" }
brenn-surface-schema = { version = "0.1.0", path = "../../schema" }
