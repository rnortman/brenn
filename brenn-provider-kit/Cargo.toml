[package]
name = "brenn-provider-kit"
version = "0.1.0"
edition = "2024"
publish = false
description = "The provider-component core shared by Brenn's in-tree WASM tool providers: the in-flight row, argument helpers and api-request answer reading"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[features]
# The schema parity checker and the step fixtures, for the components' host
# tests.
testutils = []
