[package]
name = "brenn-provider-kit"
version = "0.1.0"
edition = "2024"
publish = false
description = "The core of a Brenn WASM tool-provider component: its activation loop with deferred nested calls, the rows a request keeps, and the reading of `api-request`'s answers"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[features]
# The schema parity checker and the step fixtures, for the components' host
# tests.
testutils = []
